name: math_grade9
description: "الرياضيات الممتعة - الصف التاسع (المنهج الليبي 2025-2026)"
version: 1.0.0

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:        # ✅ دعم اللغة العربية
    sdk: flutter
  url_launcher: ^6.3.0          # ✅ فتح الروابط (تواصل / واتساب)
  shared_preferences: ^2.3.2    # ✅ حفظ تقدم الطالب
  pdf: ^3.11.1                  # ✅ إنشاء ملفات PDF
  printing: ^5.13.2             # ✅ طباعة ومشاركة PDF

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # ====== الأصول (Assets) ======
  assets:
    - assets/images/            # ✅ المسار الصحيح (بـ assets/)

  # ====== الخطوط (Fonts) ======
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        # - asset: assets/fonts/Cairo-SemiBold.ttf   # فعّلها إذا الملف موجود
        # - asset: assets/fonts/Cairo-Bold.ttf       # فعّلها إذا الملف موجود